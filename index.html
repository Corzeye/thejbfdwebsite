<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Site</title>

<style>
body{
    margin:0;
    font-family:Inter,system-ui,sans-serif;
    background:#0f172a;
    overflow:hidden;
}

/* BACKDROP (fixes ugly blue wash) */
#blurLayer{
    position:fixed;
    inset:0;
    backdrop-filter: blur(22px);
    background: rgba(0,0,0,0.65);
    z-index:10;
}

/* SITE */
#site{
    filter:none;
}

/* COOKIE MODAL */
#cookieOverlay{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:20;
}

/* more realistic “EU consent style” but NOT branded */
.cookieBox{
    width:420px;
    background:#ffffff;
    border-radius:14px;
    padding:22px 22px 18px;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
}

.cookieTitle{
    font-size:16px;
    font-weight:700;
    margin-bottom:10px;
    color:#111827;
}

.cookieText{
    font-size:13px;
    line-height:1.5;
    color:#4b5563;
}

.cookieLinks{
    margin-top:10px;
    font-size:12px;
    color:#2563eb;
}

.btnRow{
    display:flex;
    gap:10px;
    margin-top:16px;
}

button{
    flex:1;
    padding:10px 12px;
    border-radius:10px;
    border:none;
    font-weight:600;
    cursor:pointer;
}

/* primary */
.accept{
    background:#1d4ed8;
    color:white;
}

/* secondary */
.decline{
    background:#e5e7eb;
    color:#111827;
}

/* VIDEO FULLSCREEN FIX (NO STRETCHING) */
#videoContainer{
    display:none;
    position:fixed;
    inset:0;
    background:black;
    z-index:5;
}

#videoContainer video{
    width:100%;
    height:100%;
    object-fit:cover; /* IMPORTANT: no distortion, fills screen */
}
</style>

</head>

<body>

<div id="blurLayer"></div>

<!-- COOKIE -->
<div id="cookieOverlay">
    <div class="cookieBox">
        <div class="cookieTitle">Cookie settings</div>

        <div class="cookieText">
            We use cookies to store preferences, improve performance and provide a better browsing experience.
            You can accept or manage your settings.
        </div>

        <div class="cookieLinks">
            Learn more about cookies
        </div>

        <div class="btnRow">
            <button class="decline" onclick="enterSite()">Manage cookies</button>
            <button class="accept" onclick="enterSite()">Accept all</button>
        </div>
    </div>
</div>

<!-- VIDEO -->
<div id="videoContainer">
    <video id="vid" autoplay muted playsinline loop>
        <source src="getnerdalerted.mp4" type="video/mp4">
    </video>
</div>

<script>
function enterSite(){
    document.getElementById("cookieOverlay").style.display = "none";
    document.getElementById("blurLayer").style.display = "none";

    const video = document.getElementById("videoContainer");
    video.style.display = "block";

    const vid = document.getElementById("vid");

    vid.muted = false;   // try enable sound (browser may block autoplay audio)
    vid.play();
}

/* show blur immediately */
document.getElementById("blurLayer").style.display = "block";
</script>

</body>
</html>
